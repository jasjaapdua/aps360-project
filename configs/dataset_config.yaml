# Dataset configuration
huggingface_dataset: "spotify/podbaby-lyrics"  # example dataset; replace as needed
text_column: "lyrics"
artist_column: "artist"
language: "en"            # expected language code
language_column: "language"
min_tokens: 30
val_split: 0.1
test_split: 0.1
max_vocab_size: 20000
pad_token: "<pad>"
unk_token: "<unk>"
bos_token: "<bos>"
eos_token: "<eos>"
lowercase: true
remove_markup: true
