# Default training configuration for LSTM model
seed: 42
batch_size: 32
num_epochs: 20
learning_rate: 0.001
max_grad_norm: 5.0
log_interval: 50
device: "cuda"

optimizer:
  name: adam
  weight_decay: 0.0
  betas: [0.9, 0.999]

scheduler:
  name: none
  step_size: 5
  gamma: 0.5

early_stopping:
  patience: 3
  min_delta: 0.001

checkpoint:
  dir: "checkpoints"
  save_every: 1
